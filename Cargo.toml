[package]
name = "rushdown-relative-links"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Resolve the relative destinations of a rushdown document against a base directory."
license = "MIT"
repository = "https://github.com/NicolasChagnet/rushdown-relative-links"
keywords = ["links", "markdown", "url", "paths"]
categories = ["text-processing", "web-programming"]
documentation = "https://docs.rs/rushdown-relative-links"

[dependencies]
rushdown = "0.18.0"
